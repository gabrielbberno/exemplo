<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha primeira cena</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    // ================ COMPONENTE: INTERATIVO ================
    // um componente dá um comportamento novo a uma entidade.
    // Fica no <head>, antes da cena: quem lê o arquivo conhece o comportamento antes de vê-lo usado.
    AFRAME.registerComponent('interativo', {
      init: function () {
        const el = this.el;
        const nome = el.getAttribute('data-nome') || 'objeto';
        el.addEventListener('click', function () {
          // uma cor sorteada: um número de 0 a FFFFFF, escrito em hexadecimal
          const cor = '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0');
          el.setAttribute('material', 'color', cor);
          // a fonte do A-Frame não tem acentos: a mensagem fica sem eles
          document.querySelector('#texto-msg').setAttribute('value', 'Tocou em: ' + nome);
          document.querySelector('#painel-msg').setAttribute('visible', true);
        });
      }
    });
  </script>
</head>
<body>
  <!-- ================ A CENA ================ -->
  <!-- cursor: o mouse vira um "laser"; raycaster: ele só enxerga o que tem a classe clickable -->
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">

    <!-- ================ O AMBIENTE ================ -->
    <a-sky color="#16121f"></a-sky>
    <!-- o chão: um plano deitado, girado -90 graus no eixo x -->
    <a-plane rotation="-90 0 0" width="60" height="60" color="#4b3f73"></a-plane>
    <!-- a luz ambiente clareia tudo; a direcional é o sol, e mostra o volume -->
    <a-light type="ambient" color="#9a92b5" intensity="0.7"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.85" position="-1 3 2"></a-light>

    <!-- ================ OS OBJETOS ================ -->
    <!-- seis formas prontas, lado a lado, a 1 metro umas das outras e a 3 metros de você -->
    <a-box class="clickable" interativo data-nome="Cubo" position="-2.5 1.5 -3" width="0.7" height="0.7" depth="0.7" color="#ff5d8f"
          animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
      <a-text value="Cubo" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-box>
    <a-sphere class="clickable" interativo data-nome="Esfera" position="-1.5 1.5 -3" radius="0.45" color="#ffb454"
             animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
      <a-text value="Esfera" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-sphere>
    <a-cylinder class="clickable" interativo data-nome="Cilindro" position="-0.5 1.5 -3" radius="0.4" height="0.9" color="#4fd1c5"
               animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
      <a-text value="Cilindro" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-cylinder>
    <a-cone class="clickable" interativo data-nome="Cone" position="0.5 1.5 -3" radius-bottom="0.5" radius-top="0" height="0.9" color="#63b3ed"
           animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
      <a-text value="Cone" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-cone>
    <a-torus class="clickable" interativo data-nome="Toro" position="1.5 1.5 -3" radius="0.4" radius-tubular="0.12" color="#b794f4"
            animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
      <a-text value="Toro" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-torus>
    <a-dodecahedron class="clickable" interativo data-nome="Dodecaedro" position="2.5 1.5 -3" radius="0.48" color="#f687b3"
                   animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
      <a-text value="Dodecaedro" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-dodecahedron>

    <!-- ================ A CÂMERA E O PAINEL ================ -->
    <!-- o painel é filho da câmera: vai junto quando você olha em volta -->
    <a-camera>
      <a-entity id="painel-msg" visible="false" position="0 -0.55 -1"
                geometry="primitive: plane; width: 0.95; height: 0.18"
                material="color: #0e0b16; opacity: 0.88; shader: flat">
        <a-text id="texto-msg" value="" align="center" width="1.6" color="#ffffff" position="0 0 0.01"></a-text>
      </a-entity>
    </a-camera>
  </a-scene>
</body>
</html>
